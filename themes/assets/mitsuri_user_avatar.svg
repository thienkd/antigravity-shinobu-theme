<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="mitBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#4a1638"/>
      <stop offset="68%" stop-color="#260b21"/>
      <stop offset="100%" stop-color="#140512"/>
    </radialGradient>
    <linearGradient id="mitPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="mitRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="55%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="mitGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#mitBg)"/>
  <circle cx="32" cy="32" r="29.6" stroke="url(#mitRim)" stroke-opacity="0.7" stroke-width="1.35"/>

  <!-- Mitsuri 4-Leaf Sakura Clover Heart Tsuba -->
  <g filter="url(#mitGlow)" transform="translate(32, 32)">
    <!-- Top Heart Petal -->
    <path d="M 0 -2 C -4 -9, -11 -16, -5 -19 C -1 -21, 0 -17, 0 -15 C 0 -17, 1 -21, 5 -19 C 11 -16, 4 -9, 0 -2 Z" fill="url(#mitPink)" stroke="url(#mitRim)" stroke-width="1.25"/>
    <!-- Bottom Heart Petal -->
    <path d="M 0 2 C -4 9, -11 16, -5 19 C -1 21, 0 17, 0 15 C 0 17, 1 21, 5 19 C 11 16, 4 9, 0 2 Z" fill="url(#mitPink)" stroke="url(#mitRim)" stroke-width="1.25"/>
    <!-- Left Heart Petal -->
    <path d="M -2 0 C -9 -4, -16 -11, -19 -5 C -21 -1, -17 0, -15 0 C -17 0, -21 1, -19 5 C -16 11, -9 4, -2 0 Z" fill="url(#mitPink)" stroke="url(#mitRim)" stroke-width="1.25"/>
    <!-- Right Heart Petal -->
    <path d="M 2 0 C 9 -4, 16 -11, 19 -5 C 21 -1, 17 0, 15 0 C 17 0, 21 1, 19 5 C 16 11, 9 4, 2 0 Z" fill="url(#mitPink)" stroke="url(#mitRim)" stroke-width="1.25"/>
    <!-- Gold Collar -->
    <rect x="-2.4" y="-5.2" width="4.8" height="10.4" rx="1.4" fill="#260b21" stroke="#fde047" stroke-width="1.15"/>
  </g>

  <!-- Floating Sakura & Lime Sparkles -->
  <circle cx="15" cy="17" r="1.5" fill="#f9a8d4"/>
  <circle cx="49" cy="16" r="1.4" fill="#86efac"/>
  <circle cx="48" cy="48" r="1.5" fill="#f472b6"/>
  <circle cx="16" cy="47" r="1.3" fill="#bbf7d0"/>
</svg>
