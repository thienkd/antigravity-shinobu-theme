<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="ubuyaBg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#2b1752"/>
      <stop offset="58%" stop-color="#160d2e"/>
      <stop offset="100%" stop-color="#0b0618"/>
    </radialGradient>
    <linearGradient id="ubuyaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="ubuyaMoon" x1="20%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="55%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="ubuyaWist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="48%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="ubuyaGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Royal Lacquer Base -->
  <circle cx="32" cy="32" r="31.2" fill="url(#ubuyaBg)"/>
  <!-- Double Gold Lacquer Rim -->
  <circle cx="32" cy="32" r="30.2" stroke="url(#ubuyaGold)" stroke-width="1.4" opacity="0.95"/>
  <circle cx="32" cy="32" r="27.6" stroke="url(#ubuyaGold)" stroke-width="0.75" stroke-dasharray="3 1.6" opacity="0.78"/>

  <!-- Subtle Imperial Seigaiha / Halo Arcs -->
  <path d="M 16 48 Q 32 39 48 48" stroke="#fbbf24" stroke-opacity="0.22" stroke-width="0.9"/>
  <path d="M 20 52 Q 32 45 44 52" stroke="#c084fc" stroke-opacity="0.25" stroke-width="0.8"/>

  <!-- Golden Crescent & Full Moon Halo -->
  <g filter="url(#ubuyaGlow)">
    <circle cx="32" cy="29" r="12.5" fill="url(#ubuyaMoon)" opacity="0.16"/>
    <path d="M 39.8 18.8 A 12.2 12.2 0 1 1 23.2 38.6 A 10.2 10.2 0 1 0 39.8 18.8 Z" fill="url(#ubuyaMoon)"/>
  </g>

  <!-- Stylized Ubuyashiki Royal Crest (Imperial Diamond & Five-Petal Paulownia/Wisteria Mon) -->
  <g filter="url(#ubuyaGlow)" transform="translate(32, 31)">
    <!-- Outer Sacred Diamond Frame -->
    <path d="M 0 -11.5 L 10.5 0 L 0 11.5 L -10.5 0 Z" stroke="url(#ubuyaGold)" stroke-width="1.35" fill="#160d2e" fill-opacity="0.68"/>
    <path d="M 0 -8.2 L 7.4 0 L 0 8.2 L -7.4 0 Z" stroke="#fef08a" stroke-width="0.7" stroke-opacity="0.75"/>
    <!-- Central Imperial Blossom Crest -->
    <circle cx="0" cy="0" r="2.2" fill="#fef08a"/>
    <path d="M 0 -6.4 C 1.6 -4.4, 1.6 -2.4, 0 -1.6 C -1.6 -2.4, -1.6 -4.4, 0 -6.4 Z" fill="url(#ubuyaGold)"/>
    <path d="M 0 6.4 C 1.6 4.4, 1.6 2.4, 0 1.6 C -1.6 2.4, -1.6 4.4, 0 6.4 Z" fill="url(#ubuyaGold)"/>
    <path d="M -6.0 0 C -4.0 -1.5, -2.2 -1.5, -1.5 0 C -2.2 1.5, -4.0 1.5, -6.0 0 Z" fill="url(#ubuyaGold)"/>
    <path d="M 6.0 0 C 4.0 -1.5, 2.2 -1.5, 1.5 0 C 2.2 1.5, 4.0 1.5, 6.0 0 Z" fill="url(#ubuyaGold)"/>
  </g>

  <!-- Symmetrical Draping Wisteria Branches (Left & Right) -->
  <g filter="url(#ubuyaGlow)">
    <!-- Left Wisteria Raceme -->
    <path d="M 22 10 Q 14 14 13.5 25" stroke="url(#ubuyaGold)" stroke-width="0.95" stroke-linecap="round"/>
    <ellipse cx="16.5" cy="14.5" rx="2.7" ry="1.9" transform="rotate(-18 16.5 14.5)" fill="#f5d0fe"/>
    <ellipse cx="13.2" cy="17.8" rx="2.5" ry="1.8" transform="rotate(12 13.2 17.8)" fill="#e879f9"/>
    <ellipse cx="16.2" cy="20.6" rx="2.3" ry="1.7" transform="rotate(-12 16.2 20.6)" fill="#c084fc"/>
    <ellipse cx="13.4" cy="24.0" rx="2.0" ry="1.5" fill="#e879f9"/>
    <ellipse cx="15.0" cy="27.6" rx="1.6" ry="1.3" fill="#c084fc"/>
    <circle cx="14.4" cy="30.8" r="1.1" fill="#f5d0fe"/>

    <!-- Right Wisteria Raceme -->
    <path d="M 42 10 Q 50 14 50.5 25" stroke="url(#ubuyaGold)" stroke-width="0.95" stroke-linecap="round"/>
    <ellipse cx="47.5" cy="14.5" rx="2.7" ry="1.9" transform="rotate(18 47.5 14.5)" fill="#f5d0fe"/>
    <ellipse cx="50.8" cy="17.8" rx="2.5" ry="1.8" transform="rotate(-12 50.8 17.8)" fill="#e879f9"/>
    <ellipse cx="47.8" cy="20.6" rx="2.3" ry="1.7" transform="rotate(12 47.8 20.6)" fill="#c084fc"/>
    <ellipse cx="50.6" cy="24.0" rx="2.0" ry="1.5" fill="#e879f9"/>
    <ellipse cx="49.0" cy="27.6" rx="1.6" ry="1.3" fill="#c084fc"/>
    <circle cx="49.6" cy="30.8" r="1.1" fill="#f5d0fe"/>
  </g>

  <!-- Gold Leaf Sparkles -->
  <path d="M 32 8.5 L 32.9 10.8 L 35.2 11.7 L 32.9 12.6 L 32 14.9 L 31.1 12.6 L 28.8 11.7 L 31.1 10.8 Z" fill="#fef08a"/>
  <circle cx="20" cy="46" r="1.1" fill="#fbbf24" opacity="0.9"/>
  <circle cx="44" cy="46" r="1.1" fill="#fbbf24" opacity="0.9"/>
  <circle cx="32" cy="51.5" r="1.4" fill="#e879f9" opacity="0.9"/>
</svg>
