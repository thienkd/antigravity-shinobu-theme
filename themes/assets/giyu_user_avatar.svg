<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="giyuBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0f294a"/>
      <stop offset="70%" stop-color="#08162b"/>
      <stop offset="100%" stop-color="#040b17"/>
    </radialGradient>
    <linearGradient id="giyuBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="giyuWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="giyuGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#giyuBg)"/>
  <!-- Half-and-Half Haori Subtle Backdrop Accent -->
  <path d="M 32 2 A 30 30 0 0 0 32 62 Z" fill="#881337" fill-opacity="0.28"/>
  <path d="M 32 2 A 30 30 0 0 1 32 62 Z" fill="#065f46" fill-opacity="0.24"/>
  <circle cx="32" cy="32" r="29.6" stroke="#38bdf8" stroke-opacity="0.52" stroke-width="1.3"/>

  <!-- Water Breathing Swirling Vortex -->
  <g filter="url(#giyuGlow)">
    <path d="M 13 33 C 13 19, 29 11, 42 17 C 51 21, 53 34, 46 43 C 39 52, 23 52, 16 42" stroke="url(#giyuWave)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 18 27 C 23 16, 39 15, 46 25 C 50 31, 47 41, 38 46" stroke="#bae6fd" stroke-width="1.4" stroke-linecap="round" opacity="0.88"/>
  </g>

  <!-- Giyu Hexagonal Bronze-Gold Tsuba -->
  <g filter="url(#giyuGlow)" transform="translate(32, 32)">
    <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" fill="#1e1b2e" stroke="url(#giyuBronze)" stroke-width="2.3"/>
    <polygon points="0,-11.2 9.7,-5.6 9.7,5.6 0,11.2 -9.7,5.6 -9.7,-5.6" fill="#7f1d1d" fill-opacity="0.72" stroke="#fbbf24" stroke-width="0.9"/>
    <!-- Blade Collar Nakago-ana -->
    <rect x="-2.4" y="-6.2" width="4.8" height="12.4" rx="1.1" fill="#08162b" stroke="#fde68a" stroke-width="1"/>
  </g>

  <!-- Water Droplets -->
  <circle cx="15" cy="19" r="1.6" fill="#e0f2fe"/>
  <circle cx="49" cy="18" r="1.3" fill="#38bdf8"/>
  <circle cx="46" cy="49" r="1.8" fill="#7dd3fc"/>
  <circle cx="19" cy="48" r="1.2" fill="#bae6fd"/>
</svg>
