<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="obaBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#251a4a"/>
      <stop offset="68%" stop-color="#120c29"/>
      <stop offset="100%" stop-color="#070513"/>
    </radialGradient>
    <linearGradient id="obaSnake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="obaGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#obaBg)"/>
  <circle cx="32" cy="32" r="29.6" stroke="#818cf8" stroke-opacity="0.52" stroke-width="1.3"/>

  <!-- Heterochromia Eyes (Amber Gold Right / Turquoise Teal Left) -->
  <g filter="url(#obaGlow)">
    <!-- Left Viewer Side: Gold Eye -->
    <path d="M 15 21 Q 21 17 26 21 Q 21 25 15 21 Z" fill="#facc15" stroke="#fef08a" stroke-width="0.7"/>
    <ellipse cx="20.5" cy="21" rx="1.1" ry="2.6" fill="#120c29"/>
    <!-- Right Viewer Side: Teal Eye -->
    <path d="M 38 21 Q 43 17 49 21 Q 43 25 38 21 Z" fill="#2dd4bf" stroke="#99f6e4" stroke-width="0.7"/>
    <ellipse cx="43.5" cy="21" rx="1.1" ry="2.6" fill="#120c29"/>
  </g>

  <!-- White Serpent Kaburamaru Coiled in Infinity Loop -->
  <g filter="url(#obaGlow)">
    <path d="M 32 37 C 24 29, 13 30, 14 39 C 15 47, 25 47, 32 37 C 39 27, 49 27, 50 36 C 51 45, 40 47, 33 39"
          stroke="url(#obaSnake)" stroke-width="4.2" stroke-linecap="round" fill="none"/>
    <path d="M 32 37 C 24 29, 13 30, 14 39 C 15 47, 25 47, 32 37"
          stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 2" fill="none"/>
    <!-- Serpent Head & Ruby Eyes -->
    <ellipse cx="32" cy="32" rx="4.2" ry="3.2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="30.4" cy="31.5" r="1.05" fill="#ef4444"/>
    <circle cx="33.6" cy="31.5" r="1.05" fill="#ef4444"/>
    <!-- Forked Crimson Tongue -->
    <path d="M 32 28.8 L 32 25.8 M 32 26.5 L 30.6 25 M 32 26.5 L 33.4 25" stroke="#f43f5e" stroke-width="0.9" stroke-linecap="round"/>
  </g>
</svg>
