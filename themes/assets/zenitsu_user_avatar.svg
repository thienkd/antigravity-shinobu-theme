<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="zenBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#452b09"/>
      <stop offset="68%" stop-color="#221404"/>
      <stop offset="100%" stop-color="#100902"/>
    </radialGradient>
    <linearGradient id="zenBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="zenGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#zenBg)"/>
  <circle cx="32" cy="32" r="29.6" stroke="#facc15" stroke-opacity="0.62" stroke-width="1.35"/>

  <!-- Zenitsu Haori White-Gold Uroko Triangles -->
  <g fill="#fef9c3" opacity="0.32">
    <polygon points="18,22 22,15 26,22"/>
    <polygon points="40,24 44,17 48,24"/>
    <polygon points="16,42 20,35 24,42"/>
    <polygon points="39,46 43,39 47,46"/>
  </g>

  <!-- Chuntaro Sparrow Cute Golden-Cream Silhouette -->
  <g transform="translate(19, 25)" opacity="0.92">
    <circle cx="0" cy="0" r="4.2" fill="#fde68a"/>
    <path d="M -3.5 1 Q -7 -1 -6 3 Q -3 5 1 3 Z" fill="#d97706"/>
    <polygon points="3.8,-0.8 6.2,0.2 3.8,1.2" fill="#f97316"/>
    <circle cx="1.4" cy="-1" r="0.75" fill="#1e1b18"/>
  </g>

  <!-- Thunder Breathing First Form Lightning Bolt -->
  <g filter="url(#zenGlow)">
    <polygon points="37,8 21,33 31,33 25,56 45,28 34,28" fill="url(#zenBolt)" stroke="#f59e0b" stroke-width="0.9" stroke-linejoin="round"/>
    <!-- Secondary Electric Arcs -->
    <polyline points="14,36 18,32 16,28" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>
    <polyline points="48,18 45,23 49,25" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
