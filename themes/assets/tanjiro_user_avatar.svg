<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="tanBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#2b1216"/>
      <stop offset="68%" stop-color="#0d1b1e"/>
      <stop offset="100%" stop-color="#060d10"/>
    </radialGradient>
    <linearGradient id="tanFire" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="tanWater" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="tanGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#tanBg)"/>
  <circle cx="32" cy="32" r="29.6" stroke="#ef4444" stroke-opacity="0.55" stroke-width="1.35"/>

  <!-- Hinokami Kagura Flame Arc (Left/Top) & Water Breathing Stream (Right/Bottom) -->
  <g filter="url(#tanGlow)">
    <path d="M 13 42 A 21 21 0 0 1 43 13" stroke="url(#tanFire)" stroke-width="2.9" stroke-linecap="round"/>
    <path d="M 51 22 A 21 21 0 0 1 21 51" stroke="url(#tanWater)" stroke-width="2.7" stroke-linecap="round"/>
  </g>

  <!-- Iconic Hanafuda Rising Sun Earring -->
  <g filter="url(#tanGlow)">
    <line x1="32" y1="11" x2="32" y2="16" stroke="#fde047" stroke-width="1.3" stroke-linecap="round"/>
    <rect x="22" y="16" width="20" height="31" rx="2.4" fill="#fffbeb" stroke="#1e293b" stroke-width="1.4"/>
    <!-- Rising Sun & Rays -->
    <circle cx="32" cy="25.5" r="4.6" fill="#dc2626"/>
    <line x1="32" y1="17.5" x2="32" y2="20.2" stroke="#dc2626" stroke-width="1.2"/>
    <line x1="25" y1="20" x2="27.8" y2="22.2" stroke="#dc2626" stroke-width="1.2"/>
    <line x1="39" y1="20" x2="36.2" y2="22.2" stroke="#dc2626" stroke-width="1.2"/>
    <line x1="23.2" y1="25.5" x2="26.5" y2="25.5" stroke="#dc2626" stroke-width="1.2"/>
    <line x1="40.8" y1="25.5" x2="37.5" y2="25.5" stroke="#dc2626" stroke-width="1.2"/>
    <!-- Dark Mountain Horizon -->
    <path d="M 22.7 36 Q 32 31.5 41.3 36 L 41.3 46.3 L 22.7 46.3 Z" fill="#1f2937"/>
    <circle cx="32" cy="41.2" r="2.2" fill="#f8fafc"/>
  </g>
</svg>
