  <polygon points="7.5,3.8 9.6,5.9 7.5,8.0 5.4,5.9" fill="#fef08a"/>
  <!-- Cascading Miniature Wisteria Cluster -->
  <ellipse cx="10.2" cy="10.5" rx="2.1" ry="1.4" transform="rotate(-25 10.2 10.5)" fill="url(#ubuyaCornerWist)"/>
  <ellipse cx="8.8" cy="13.6" rx="1.8" ry="1.25" transform="rotate(12 8.8 13.6)" fill="#e879f9"/>
  <ellipse cx="10.4" cy="16.4" rx="1.45" ry="1.05" fill="#c084fc"/>
  <circle cx="9.6" cy="19.0" r="0.9" fill="#f5d0fe"/>
  <!-- Gold Dust Accent -->
