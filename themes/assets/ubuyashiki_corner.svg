  </defs>
  <!-- Outer & Inner Double Gold Lacquer Frame Lines -->
  <path d="M 2.2 28 L 2.2 7.2 Q 2.2 2.2 7.2 2.2 L 28 2.2" stroke="url(#ubuyaCornerGold)" stroke-width="1.65" stroke-linecap="round"/>
  <path d="M 5.4 23 L 5.4 8.6 Q 5.4 5.4 8.6 5.4 L 23 5.4" stroke="#fef08a" stroke-width="0.85" stroke-linecap="round" opacity="0.82"/>
